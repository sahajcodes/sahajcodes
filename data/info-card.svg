<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img" aria-label="Developer information card">
  <title>Developer information card</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .title { font-size: 13px; fill: #8b949e; }
    .prompt { font-size: 15px; }
    .label { font-size: 14px; font-weight: 700; letter-spacing: 0.6px; fill: #58a6ff; }
    .value { font-size: 14px; fill: #e6edf3; }
    .row { opacity: 0; animation-name: rowIn; animation-duration: 0.6s; animation-timing-function: ease-out; animation-fill-mode: both; }
    @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
  </style>
  <defs>
    <clipPath id="card-clip"><rect x="0.5" y="0.5" width="759" height="285" rx="12" ry="12"/></clipPath>
  </defs>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="759" height="285" rx="12" ry="12" fill="#0d1117"/>

  <!-- Title bar -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="760" height="44" fill="#161b22"/>
    <line x1="0" y1="44" x2="760" y2="44" stroke="#30363d" stroke-width="1"/>
  </g>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <text class="mono title" x="380.0" y="26" text-anchor="middle">sahajcodes — info</text>

  <!-- Prompt line -->
  <text class="mono prompt" x="36" y="86" xml:space="preserve"><tspan fill="#3fb950">sahajcodes@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">neofetch</tspan></text>
  <line x1="36" y1="108" x2="724" y2="108" stroke="#30363d" stroke-width="1"/>

  <!-- Information rows -->
  <g class="row" style="animation-delay: 0.35s">
  <text class="mono label" x="36" y="142.0">NOW</text>
  <text class="mono value" x="190" y="142.0">Building practical projects and learning by doing</text>
  <line x1="36" y1="157.0" x2="724" y2="157.0" stroke="#30363d" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay: 0.53s">
  <text class="mono label" x="36" y="180.0">FOCUS</text>
  <text class="mono value" x="190" y="180.0">Web development, problem solving, and DSA</text>
  <line x1="36" y1="195.0" x2="724" y2="195.0" stroke="#30363d" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay: 0.71s">
  <text class="mono label" x="36" y="218.0">STACK</text>
  <text class="mono value" x="190" y="218.0">HTML, CSS, JavaScript, Python, and Git</text>
  <line x1="36" y1="233.0" x2="724" y2="233.0" stroke="#30363d" stroke-opacity="0.45" stroke-width="1"/>
  </g>
  <g class="row" style="animation-delay: 0.89s">
  <text class="mono label" x="36" y="256.0">HIGHLIGHTS</text>
  <text class="mono value" x="190" y="256.0">Project-driven learning and continuous improvement</text>
  </g>

  <!-- Card border -->
  <rect x="0.5" y="0.5" width="759" height="285" rx="12" ry="12" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
