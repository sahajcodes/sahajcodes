<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Technology stack</title><desc id="desc">Cherry and matcha developer profile section.</desc><style>
.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Arial,Helvetica,sans-serif}
@keyframes rise{0%{transform:translateY(32px);opacity:0}100%{transform:translateY(0);opacity:1}}
