<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">About Sahajpreet Kaur</title><desc id="desc">Cherry and matcha developer profile section.</desc><style>
.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Arial,Helvetica,sans-serif}
@keyframes rise{0%{transform:translateY(32px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes role{0%,22%{opacity:1}25%,100%{opacity:0}}@keyframes slide1{0%,30%{opacity:1}33%,100%{opacity:0}}@keyframes slide2{0%,33%{opacity:0}36%,63%{opacity:1}66%,100%{opacity:0}}@keyframes slide3{0%,66%{opacity:0}69%,96%{opacity:1}100%{opacity:0}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sweep{0%{transform:translateX(-260px);opacity:0}20%{opacity:.35}80%{opacity:.35}100%{transform:translateX(700px);opacity:0}}
@keyframes drop{0%{transform:translateY(-80px) rotate(-7deg);opacity:0}55%{transform:translateY(8px) rotate(2deg);opacity:1}75%{transform:translateY(-3px) rotate(-1deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes swing{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F3E8"/><stop offset="1" stop-color="#eee7d8"/></linearGradient><linearGradient id="cherryGrad" x2="1" y2="1"><stop stop-color="#670626"/><stop offset="1" stop-color="#3D071A"/></linearGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#8FAE75" opacity=".45"/></pattern></defs><rect width="1200" height="390" rx="24" fill="#3D071A"/><text x="54" y="62" class="mono" font-size="14" letter-spacing="3" fill="#BAD797">01 / A LITTLE ABOUT ME</text><text x="54" y="126" class="serif" font-size="54" fill="#F7F3E8">Curiosity, with a</text><text x="54" y="184" class="serif" font-size="54" font-style="italic" fill="#BAD797">builder’s mindset.</text><text x="56" y="232" class="sans" font-size="17" fill="#e8dfd2">I’m a student developer learning by making things — from</text><text x="56" y="258" class="sans" font-size="17" fill="#e8dfd2">web applications to practical tools that solve everyday problems.</text><rect x="56" y="300" width="480" height="1" fill="#8FAE75"/><text x="56" y="333" class="mono" font-size="13" fill="#BAD797">BUILD  ·  EXPERIMENT  ·  IMPROVE</text><rect x="650" y="38" width="496" height="314" rx="18" fill="#F7F3E8"/><text x="684" y="78" class="mono" font-size="12" fill="#670626" letter-spacing="2">CURRENT CURIOSITIES</text><g style="opacity:1;animation:slide1 12s linear infinite;animation-fill-mode:both"><text x="684" y="151" class="serif" font-size="42" fill="#3D071A">Making useful things</text><text x="684" y="192" class="sans" font-size="16" fill="#65584f">Creative digital projects and practical applications.</text><text x="684" y="287" class="mono" font-size="12" fill="#8FAE75">SLIDE 01 / 03</text></g><g style="opacity:0;animation:slide2 12s linear infinite;animation-fill-mode:both"><text x="684" y="151" class="serif" font-size="42" fill="#3D071A">Understanding the why</text><text x="684" y="192" class="sans" font-size="16" fill="#65584f">DSA, object-oriented design, and problem-solving.</text><text x="684" y="287" class="mono" font-size="12" fill="#8FAE75">SLIDE 02 / 03</text></g><g style="opacity:0;animation:slide3 12s linear infinite;animation-fill-mode:both"><text x="684" y="151" class="serif" font-size="42" fill="#3D071A">What’s next</text><text x="684" y="192" class="sans" font-size="16" fill="#65584f">Backend development, AI, and emerging technology.</text><text x="684" y="287" class="mono" font-size="12" fill="#8FAE75">SLIDE 03 / 03</text></g><rect x="684" y="318" width="128" height="5" rx="2" fill="#BAD797" opacity=".35"/><rect x="684" y="318" width="128" height="5" rx="2" fill="#670626" style="animation:slide1 12s linear infinite" transform="translate(0 0)"/><rect x="684" y="318" width="128" height="5" rx="2" fill="#BAD797" opacity=".35"/><rect x="684" y="318" width="128" height="5" rx="2" fill="#670626" style="animation:slide2 12s linear infinite" transform="translate(142 0)"/><rect x="684" y="318" width="128" height="5" rx="2" fill="#BAD797" opacity=".35"/><rect x="684" y="318" width="128" height="5" rx="2" fill="#670626" style="animation:slide3 12s linear infinite" transform="translate(284 0)"/></svg>